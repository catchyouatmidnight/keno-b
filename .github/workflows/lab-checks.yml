name: Keno-B Lab checks
on:
  push:
    paths: ['web/**', 'app/lab.py', 'app/library.py', 'app/main.py', 'Dockerfile', '.github/workflows/lab-checks.yml']
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-validation
          path: |
            web/artifacts
            web/package-lock.json
            web/dist
