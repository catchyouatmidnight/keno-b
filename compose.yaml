name: keno
services:
  gateway:
    image: nginx:1.28-alpine
    entrypoint: [nginx]
    command: ["-g", "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [edge, private]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 64m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  backend:
    image: ${KENO_IMAGE:-keno-backend:local}
    build: .
    restart: unless-stopped
    environment:
      KENO_API_KEY: ${KENO_API_KEY:?Run bash scripts/setup.sh first}
      KENO_DB: /data/keno.db
      KENO_DOCUMENT_KEY: ${KENO_DOCUMENT_KEY:-}
      LLM_URL: http://llm:8080
      LLM_MODEL: ${MODEL_FILE:-Qwen3.5-2B-Q4_K_M.gguf}
      CONTEXT_SIZE: ${CONTEXT_SIZE:-8192}
      LAYA_URL: http://laya:8000
      LOOKUP_URL: http://lookup:8000
      VISION_ENABLED: ${VISION_ENABLED:-true}
    volumes:
      - ./data:/data
    networks: [private]
    depends_on:
      llm:
        condition: service_started
      laya:
        condition: service_started
    mem_limit: 768m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  llm:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b11146}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/config/llm-entrypoint.sh"]
    environment:
      VISION_ENABLED: ${VISION_ENABLED:-true}
      MMPROJ_FILE: ${MMPROJ_FILE:-Qwen3.5-2B-mmproj-F16.gguf}
    command:
      - --model
      - /models/${MODEL_FILE:-Qwen3.5-2B-Q4_K_M.gguf}
      - --alias
      - ${MODEL_FILE:-Qwen3.5-2B-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${CONTEXT_SIZE:-8192}
      - --parallel
      - "1"
      - --threads
      - ${CPU_THREADS:-4}
      - --batch-size
      - "256"
      - --ubatch-size
      - "128"
      - --n-gpu-layers
      - "0"
      - --jinja
      - --reasoning
      - "auto"
      - --reasoning-format
      - deepseek
      - --reasoning-budget
      - "384"
      - --no-webui
      - --offline
      - --log-verbosity
      - ${LLM_LOG_VERBOSITY:-1}
    volumes:
      - ./models:/models:ro
      - ./scripts/llm-entrypoint.sh:/config/llm-entrypoint.sh:ro
    networks: [private]
    mem_limit: ${LLM_MEMORY_LIMIT:-6g}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  laya:
    image: keno-laya:local
    build: ./laya-service
    restart: unless-stopped
    environment:
      LAYA_THREADS: ${LAYA_THREADS:-2}
    volumes:
      - ./models/laya:/models-source:ro
    networks: [private]
    mem_limit: ${LAYA_MEMORY_LIMIT:-3g}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  embedding:
    profiles: [library]
    image: keno-embedding:local
    build: ./embedding-service
    restart: unless-stopped
    volumes:
      - ./models/embedding:/models:ro
    networks: [private]
    mem_limit: 768m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  lookup:
    profiles: [live]
    image: keno-lookup:local
    build: ./lookup-service
    restart: unless-stopped
    environment:
      KENO_API_KEY: ${KENO_API_KEY:?Run bash scripts/setup.sh first}
      SEARCH_URL: http://search:8080/search
    networks: [private, edge]
    mem_limit: 192m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  search:
    profiles: [live]
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:latest}
    restart: unless-stopped
    environment:
      FORCE_OWNERSHIP: "false"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: ${KENO_SEARCH_SECRET:-}
    volumes:
      - ./deploy/search-settings.yml:/etc/searxng/settings.yml:ro
      - search_cache:/var/cache/searxng
    networks: [edge]
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
volumes:
  search_cache:
networks:
  edge:
    driver: bridge
  private:
    internal: true
